name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: Supabase credentials are not set in GitHub Secrets."
            echo "Please configure PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_ANON_KEY in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Pinging Supabase to prevent inactivity pausing..."
          # Try keep_alive table first, fall back to leads endpoint
          curl -s -f -X GET "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || \
          curl -s -f -X GET "${SUPABASE_URL}/rest/v1/leads?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"

          echo ""
          echo "Supabase heartbeat successfully sent!"
